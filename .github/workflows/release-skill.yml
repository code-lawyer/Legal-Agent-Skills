name: Release skill zip

# 打 tag（v* / contract-review-v* / legal-research-v*）即自动校验并把 skill 打包成 zip 发到 Releases。
# 按 tag 前缀条件化：contract-review-v* 只发 contract-review；legal-research-v* 只发 legal-research；
# 其他（如通用 v*）两个都校验+打包，发布同一 Release 附两个 zip。
# 用法：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
      - 'contract-review-v*'
      - 'legal-research-v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 按 tag 前缀判定发布范围与 zip 命名
        id: flags
        run: |
          # 默认两个都发；专属前缀只关掉另一个
          do_contract=true; do_legal=true
          case "$GITHUB_REF_NAME" in
            contract-review-v*) do_legal=false ;;
            legal-research-v*)  do_contract=false ;;
          esac
          # zip 命名：分技能 tag（contract-review-v* / legal-research-v*）已自带技能名前缀，
          # 直接用 tag 名，避免 contract-review-contract-review-v* 式双前缀；
          # 合并 tag（v*）不含技能名，补上技能名前缀。两种情形都得到 <技能>-v<版本>.zip。
          case "$GITHUB_REF_NAME" in
            contract-review-v*) contract_zip="${GITHUB_REF_NAME}.zip" ;;
            *)                  contract_zip="contract-review-${GITHUB_REF_NAME}.zip" ;;
          esac
          case "$GITHUB_REF_NAME" in
            legal-research-v*) legal_zip="${GITHUB_REF_NAME}.zip" ;;
            *)                 legal_zip="legal-research-${GITHUB_REF_NAME}.zip" ;;
          esac
          echo "do_contract=$do_contract" >> "$GITHUB_OUTPUT"
          echo "do_legal=$do_legal" >> "$GITHUB_OUTPUT"
          echo "contract_zip=$contract_zip" >> "$GITHUB_OUTPUT"
          echo "legal_zip=$legal_zip" >> "$GITHUB_OUTPUT"

      - name: 自检 contract-review（结构校验必须通过才发布）
        if: steps.flags.outputs.do_contract == 'true'
        run: python3 contract-review/validate.py

      - name: 自检 legal-research（结构校验必须通过才发布）
        if: steps.flags.outputs.do_legal == 'true'
        run: python3 legal-research/validate.py

      - name: 打包 contract-review zip
        if: steps.flags.outputs.do_contract == 'true'
        run: |
          zip -r "${{ steps.flags.outputs.contract_zip }}" contract-review \
            -x '*/__pycache__/*' '*.pyc'

      - name: 打包 legal-research zip
        if: steps.flags.outputs.do_legal == 'true'
        run: |
          zip -r "${{ steps.flags.outputs.legal_zip }}" legal-research \
            -x '*/__pycache__/*' '*.pyc' '*/.pytest_cache/*'

      - name: 创建 / 更新 Release（按发布范围附对应 zip）
        env:
          GH_TOKEN: ${{ github.token }}
          DO_CONTRACT: ${{ steps.flags.outputs.do_contract }}
          DO_LEGAL: ${{ steps.flags.outputs.do_legal }}
          CONTRACT_ZIP: ${{ steps.flags.outputs.contract_zip }}
          LEGAL_ZIP: ${{ steps.flags.outputs.legal_zip }}
        run: |
          FILES=()
          if [ "$DO_CONTRACT" = true ]; then FILES+=("$CONTRACT_ZIP"); fi
          if [ "$DO_LEGAL" = true ]; then FILES+=("$LEGAL_ZIP"); fi

          if [ "$DO_CONTRACT" = true ] && [ "$DO_LEGAL" = true ]; then
            TITLE="${GITHUB_REF_NAME}"
            NOTES="本仓库两个 Skill 的合并发布：contract-review（合同审查，中美双法域）与 legal-research（法律研究与案例检索分析）。下载对应 zip → 解压得到 skill 文件夹 → 交给文件系统类 AI agent 并指向其中的 SKILL.md。详见各自 README.md。"
          elif [ "$DO_CONTRACT" = true ]; then
            # 标题用中文名 + tag，避免 "contract-review contract-review-v*" 式重名
            TITLE="合同审查（中美双法域） ${GITHUB_REF_NAME}"
            NOTES="合同审查 Skill（中美双法域）。下载 zip → 解压得到 contract-review/ 文件夹 → 交给文件系统类 AI agent 并指向其中的 SKILL.md。详见仓库 contract-review/README.md。"
          else
            TITLE="法律研究与案例检索分析 ${GITHUB_REF_NAME}"
            NOTES="法律研究与案例检索分析 Skill。下载 zip → 解压得到 legal-research/ 文件夹 → 交给文件系统类 AI agent 并指向其中的 SKILL.md。详见仓库 legal-research/README.md。"
          fi

          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" --title "$TITLE" --notes "$NOTES" \
            || gh release upload "${GITHUB_REF_NAME}" "${FILES[@]}" --clobber
